<!DOCTYPE html>
<html data-bs-color-scheme>
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The page supports only a dark color schemes -->
    <meta name="color-scheme" content="dark light" />

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-TQEEYG0T0M"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-TQEEYG0T0M", {
        custom_map: {
          dimension1: "region",
          dimension2: "season",
        },
      });
    </script>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>FIRST Championship - FTC Region Match Listing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="style/main.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="style/spinner.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/css/bootstrap-blackbox.min.css"
      rel="stylesheet"
    />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/js/darkmode.min.js"></script>
    <script
      src="https://kit.fontawesome.com/a8225888ab.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </head>
  <body>
    <nav
      id="navbar"
      class="navbar navbar-expand-lg sticky-top navbar-dark bg-dark"
    >
      <a class="navbar-brand" style="margin-left: 15px"
        >FTC Region Match Listing</a
      >

      <form class="form-inline">
        <div class="navItem">
          <label class="lightModeText" for="selectedRegion">Region:</label>
          <select
            id="selectedRegion"
            name="selectedRegion"
            class="form-control"
          >
            <optgroup label="United States">
              <option value="AK">Alaska</option>
              <option value="AL">Alabama</option>
              <option value="AR">Arkansas</option>
              <option value="AZ">Arizona</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="IA">Iowa</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="MA">Massachusetts</option>
              <option value="FIM">Michigan (FIRST in Michigan)</option>
              <option value="MN">Minnesota</option>
              <option value="MO">Missouri</option>
              <option value="MS">Mississippi</option>
              <option value="MT">Montana</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="NE">Nebraska</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NV">Nevada</option>
              <option value="NY">New York</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VA">Virginia / Chesapeake</option>
              <option value="VT">Vermont</option>
              <option value="WA">Washington</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </optgroup>
            <optgroup label="Canada">
              <option value="AB">Alberta</option>
              <option value="BC">British Columbia</option>
              <option value="ON">Ontario</option>
              <option value="QC">Québec</option>
            </optgroup>
            <optgroup label="International">
              <option value="AUS">Australia</option>
              <option value="BRA">Brazil</option>
              <option value="CHN">China</option>
              <option value="GBR">United Kingdom</option>
              <option value="ISR">Israel</option>
              <option value="SKR">South Korea</option>
              <option value="TWN">Taiwan</option>
            </optgroup>
          </select>
        </div>

        <div class="navItem">
          <label class="lightModeText" for="selectedSeason">Season:</label>
          <select id="selectedSeason" name="selectedSeason" class="form-control">
            <option value="2526">2025-26 (DECODE)</option>
            <option value="2425">2024-25 (INTO THE DEEP)</option>
            <option value="2324">2023-24 (CENTERSTAGE)</option>
            <option value="2223">2022-23 (POWERPLAY)</option>
            <option value="2122">2021-22 (FREIGHT FRENZY)</option>
            <option value="2021">2020-21 (Ultimate Goal)</option>
          </select>
        </div>
      </form>

      <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link" href="#rankInfo">Rankings</a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            data-bs-toggle="dropdown"
            href="#"
            role="button"
            aria-expanded="false"
            >Divisions</a
          >
          <ul class="dropdown-menu" id="divisionsDropdown">
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#allMatchInfo">All Matches</a>
        </li>
      </ul>
      <ul class="nav nav-pills ms-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            href="https://github.com/dracco1993/FRCStats/"
            target="_blank"
          >
            GitHub
          </a>
        </li>
        <li class="nav-item">
          <div id="dark-mode-selector">
            <input type="checkbox" class="checkbox" id="darkModeCheckbox" />
            <label for="darkModeCheckbox" class="checkbox-label">
              <i class="fas fa-moon"></i>
              <i class="fas fa-sun"></i>
              <span class="ball"></span>
            </label>
          </div>
        </li>
      </ul>
    </nav>

    <div
      data-bs-spy="scroll"
      data-bs-target="#navbar"
      data-bs-offset="100"
      tabindex="0"
      id="content"
    >
      <div
        id="rankInfo"
        class="p-2 container justify-content-center align-items-center text-center"
      ></div>

      <div
        id="matchInfo"
        class="p-2 container justify-content-center align-items-center text-center"
      ></div>

      <div
        id="allMatchInfo"
        class="p-2 container justify-content-center align-items-center text-center"
      ></div>

      <footer>
        <hr />
        <div
          class="p-2 container justify-content-center align-items-center text-center"
        >
          <div class="row">
            <div class="col-md-12">
              <p>
                Made with ❤️ by
                <a href="https://github.com/dracco1993" target="_blank"
                  >Jordan Miller</a
                >
                | © 2025
              </p>

              <p>
                Powered by
                <a href="https://theorangealliance.org/" target="_blank"
                  >The Orange Alliance</a
                >
              </p>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <div id="countdown">
      <div id="icon">
        <i class="fas fa-hourglass"></i>
      </div>

      <div id="eta"></div>
    </div>

    <div id="spinner" class="lds-roller hide">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
